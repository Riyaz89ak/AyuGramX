name: Build AyuGramX Magic Audio
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject Audio Magic
        run: |
          # ஆடியோ மாற்றங்கள்
          find . -name "MediaController.java" -exec sed -i 's/AudioSource.MIC/AudioSource.VOICE_COMMUNICATION/g' {} +
          find . -name "MediaController.java" -exec sed -i 's/noiseSuppression = true/noiseSuppression = false/g' {} +

      - name: Set up JDK 11
        # பழைய சோர்ஸ் என்பதால் JDK 11-ல் முயற்சிப்போம்
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Universal APK
        run: |
          chmod +x gradlew
          # எர்ரர்களைப் புறக்கணித்து பில்ட் செய்ய இந்த கமாண்ட் உதவும்
          export GRADLE_OPTS="-Xmx4g"
          ./gradlew assembleDebug -PgenerateUniversalApk=true --no-daemon -x test
          
